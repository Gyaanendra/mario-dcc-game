<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="gitBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#gitBg)"/>
  <rect x="2" y="2" width="796" height="446" rx="14" fill="none" stroke="#475569" stroke-width="2"/>

  <!-- Window Header -->
  <rect x="0" y="0" width="800" height="42" rx="16" fill="#0f172a"/>
  <circle cx="24" cy="21" r="6" fill="#ef4444"/>
  <circle cx="44" cy="21" r="6" fill="#eab308"/>
  <circle cx="64" cy="21" r="6" fill="#22c55e"/>
  <text x="400" y="26" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">GIT VERSION CONTROL · TEAM MERGE CONFLICT WORKFLOW</text>

  <!-- Git Graph Lines -->
  <!-- Main branch line -->
  <line x1="80" y1="160" x2="720" y2="160" stroke="#3b82f6" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Feature branch curve -->
  <path d="M 220 160 Q 270 260 320 260 L 520 260 Q 580 260 620 160" fill="none" stroke="#ec4899" stroke-width="5" stroke-linecap="round"/>

  <!-- Branch Labels -->
  <rect x="60" y="115" width="80" height="28" rx="6" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="100" y="134" text-anchor="middle" fill="#dbeafe" font-family="monospace" font-size="12" font-weight="bold">main</text>

  <rect x="290" y="290" width="130" height="28" rx="6" fill="#831843" stroke="#f472b6" stroke-width="1.5"/>
  <text x="355" y="309" text-anchor="middle" fill="#fce7f3" font-family="monospace" font-size="11" font-weight="bold">feature/login</text>

  <!-- Commit Nodes on Main -->
  <!-- C1 -->
  <circle cx="120" cy="160" r="14" fill="#1d4ed8" stroke="#93c5fd" stroke-width="3"/>
  <text x="120" y="165" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11" font-weight="bold">C1</text>

  <!-- C2 (Branch point) -->
  <circle cx="220" cy="160" r="14" fill="#1d4ed8" stroke="#93c5fd" stroke-width="3"/>
  <text x="220" y="165" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11" font-weight="bold">C2</text>

  <!-- C3 (Main commit) -->
  <circle cx="420" cy="160" r="14" fill="#1d4ed8" stroke="#93c5fd" stroke-width="3"/>
  <text x="420" y="165" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11" font-weight="bold">C3</text>
  <text x="420" y="125" text-anchor="middle" fill="#93c5fd" font-family="monospace" font-size="10">auth.ts modified</text>

  <!-- Merge Node -->
  <circle cx="620" cy="160" r="16" fill="#eab308" stroke="#fef08a" stroke-width="4"/>
  <text x="620" y="166" text-anchor="middle" fill="#000" font-family="monospace" font-size="11" font-weight="bold">M</text>
  <text x="620" y="115" text-anchor="middle" fill="#fde047" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">MERGE CONFLICT</text>

  <!-- Commit Nodes on Feature -->
  <!-- F1 -->
  <circle cx="340" cy="260" r="14" fill="#be185d" stroke="#fbcfe8" stroke-width="3"/>
  <text x="340" y="265" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11" font-weight="bold">F1</text>

  <!-- F2 -->
  <circle cx="480" cy="260" r="14" fill="#be185d" stroke="#fbcfe8" stroke-width="3"/>
  <text x="480" y="265" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11" font-weight="bold">F2</text>
  <text x="480" y="240" text-anchor="middle" fill="#f472b6" font-family="monospace" font-size="10">auth.ts modified</text>

  <!-- Question Callout -->
  <g transform="translate(60, 345)">
    <rect width="680" height="75" rx="10" fill="#020617" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="25" y="28" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">SCENARIO: Both C3 and F2 modified auth.ts lines 15–25 differently.</text>
    <text x="25" y="52" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">What command safely prepares feature/login with latest main changes before opening a PR?</text>
  </g>
</svg>
