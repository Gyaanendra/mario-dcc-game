<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="clientBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="gwBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>
    <linearGradient id="dbBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581c87"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </linearGradient>
    <linearGradient id="bottleneck" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#archBg)"/>
  <rect x="2" y="2" width="796" height="446" rx="14" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="800" height="42" rx="16" fill="#1e293b"/>
  <circle cx="24" cy="21" r="6" fill="#ef4444"/>
  <circle cx="44" cy="21" r="6" fill="#eab308"/>
  <circle cx="64" cy="21" r="6" fill="#22c55e"/>
  <text x="400" y="26" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">SYSTEM DESIGN ARCHITECTURE · 150 CONCURRENT USERS BURST</text>

  <!-- Flow Nodes -->
  <!-- 1. Client -->
  <g transform="translate(40, 160)">
    <rect width="130" height="110" rx="12" fill="url(#clientBox)" stroke="#3b82f6" stroke-width="2"/>
    <text x="65" y="42" text-anchor="middle" fill="#bfdbfe" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Mobile / Web</text>
    <text x="65" y="64" text-anchor="middle" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="11">Clients (150)</text>
    <text x="65" y="90" text-anchor="middle" fill="#60a5fa" font-family="monospace" font-size="10">ws:// + http://</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 175 215 L 225 215" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6,4"/>
  <polygon points="225,210 235,215 225,220" fill="#38bdf8"/>
  <text x="202" y="205" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="9">Burst</text>

  <!-- 2. Fastify API / WS Gateway -->
  <g transform="translate(240, 140)">
    <rect width="150" height="150" rx="14" fill="url(#gwBox)" stroke="#22c55e" stroke-width="2"/>
    <text x="75" y="38" text-anchor="middle" fill="#bbf7d0" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Node.js Server</text>
    <text x="75" y="60" text-anchor="middle" fill="#86efac" font-family="system-ui, sans-serif" font-size="11">Fastify + ws</text>
    <rect x="18" y="76" width="114" height="28" rx="6" fill="#14532d"/>
    <text x="75" y="95" text-anchor="middle" fill="#4ade80" font-family="monospace" font-size="10">In-Memory Map</text>
    <text x="75" y="125" text-anchor="middle" fill="#86efac" font-family="system-ui, sans-serif" font-size="10">RSS: ~98 MB</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 395 215 L 445 215" stroke="#a855f7" stroke-width="3"/>
  <polygon points="445,210 455,215 445,220" fill="#a855f7"/>
  <text x="422" y="205" text-anchor="middle" fill="#c084fc" font-family="monospace" font-size="9">SQL sync</text>

  <!-- 3. SQLite Storage Engine (Bottleneck indicator) -->
  <g transform="translate(460, 140)">
    <rect width="140" height="150" rx="14" fill="url(#dbBox)" stroke="#a855f7" stroke-width="2"/>
    <text x="70" y="38" text-anchor="middle" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">SQLite WAL</text>
    <text x="70" y="60" text-anchor="middle" fill="#c084fc" font-family="system-ui, sans-serif" font-size="11">Single Writer</text>
    <rect x="15" y="76" width="110" height="28" rx="6" fill="#3b0764"/>
    <text x="70" y="95" text-anchor="middle" fill="#d8b4fe" font-family="monospace" font-size="10">WAL Mode ON</text>
    <text x="70" y="125" text-anchor="middle" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="10">Disk I/O Flush</text>
  </g>

  <!-- Arrow 3 to Big Screen -->
  <path d="M 605 215 L 645 215" stroke="#facc15" stroke-width="3" stroke-dasharray="6,4"/>
  <polygon points="645,210 655,215 645,220" fill="#facc15"/>

  <!-- 4. Projector Display -->
  <g transform="translate(660, 160)">
    <rect width="105" height="110" rx="12" fill="#451a03" stroke="#f59e0b" stroke-width="2"/>
    <text x="52" y="42" text-anchor="middle" fill="#fef3c7" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Projector</text>
    <text x="52" y="64" text-anchor="middle" fill="#fde68a" font-family="system-ui, sans-serif" font-size="11">Live Board</text>
    <text x="52" y="90" text-anchor="middle" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="10">Top 50 Ranks</text>
  </g>

  <!-- Question Callout Banner below -->
  <g transform="translate(50, 335)">
    <rect width="700" height="85" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="25" y="28" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">SYSTEM QUESTION: Why is WAL (Write-Ahead Logging) enabled on SQLite for this event?</text>
    <text x="25" y="52" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">• Regular SQLite locks the entire database file during writes, blocking concurrent readers.</text>
    <text x="25" y="70" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">• WAL mode allows multiple readers (leaderboard/projector) while the single writer commits answers.</text>
  </g>
</svg>
