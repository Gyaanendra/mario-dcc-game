    <rect x="35" y="140" width="65" height="10" rx="4" fill="#6366f1"/>
    <rect x="35" y="160" width="65" height="60" rx="4" fill="#4338ca"/>
    
    <text x="135" y="95" fill="#f87171" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">⚠️ Text in tables &amp; images</text>
    <text x="135" y="115" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Icons instead of headings</text>
    <text x="135" y="135" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Progress bar skill ratings (80%)</text>
    <text x="135" y="155" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Embedded font encoding</text>

    <!-- Score badge -->
