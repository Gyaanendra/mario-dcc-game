  <!-- Right: Candidate B (Clean Linear) -->
  <g transform="translate(430, 70)">
    <rect width="320" height="340" rx="14" fill="#064e3b" stroke="#22c55e" stroke-width="2"/>
    <rect x="15" y="15" width="290" height="36" rx="8" fill="#065f46"/>
    <text x="160" y="38" text-anchor="middle" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">FORMAT B · SINGLE-COLUMN TEXT</text>

    <!-- Mock layout linear -->
    <rect x="25" y="70" width="270" height="180" rx="6" fill="#0f172a"/>
    <rect x="40" y="85" width="120" height="12" rx="3" fill="#22c55e"/>
    <rect x="40" y="105" width="240" height="6" rx="2" fill="#475569"/>
    <rect x="40" y="117" width="220" height="6" rx="2" fill="#475569"/>

    <rect x="40" y="140" width="140" height="12" rx="3" fill="#3b82f6"/>
    <rect x="40" y="160" width="240" height="6" rx="2" fill="#475569"/>
    <rect x="40" y="172" width="210" height="6" rx="2" fill="#475569"/>
    <rect x="40" y="184" width="230" height="6" rx="2" fill="#475569"/>

